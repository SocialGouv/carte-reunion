# Modèle : ne jamais versionner les vraies valeurs. Créer le Secret à la main, par exemple :
#   kubectl -n carte-reunion create secret generic carte-reunion-secrets \
#     --from-literal=LITELLM_API_KEY=sk-... --from-literal=CREATE_TOKEN=$(openssl rand -hex 16)
apiVersion: v1
kind: Secret
metadata:
  name: carte-reunion-secrets
type: Opaque
stringData:
  # Clé de service LiteLLM dédiée (équipe sdpc-services, alias services/carte-reunion/prototype),
  # avec expiration et budget, autorisée sur scaleway/whisper-large-v3 et le modèle chat choisi.
  LITELLM_API_KEY: sk-...
  # Exigé pour créer une séance : l'URL est publique et chaque séance consomme du LiteLLM.
  CREATE_TOKEN: ...
